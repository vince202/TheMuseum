<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/tarot-card.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore the mystical world of tarot through our interactive digital museum. Discover card meanings, history, and symbolism across centuries of divination tradition." />
  <meta name="keywords" content="tarot museum, tarot cards, divination, symbolism, interactive museum, tarot history" />
  <meta name="author" content="Tarot Museum Collective" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tarot-museum.com/" />
  <meta property="og:title" content="Interactive Tarot Museum - Explore the Mystical Arts" />
  <meta property="og:description" content="Discover the rich history and symbolism of tarot through our immersive digital museum experience." />
  <meta property="og:image" content="/og-image.jpg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://tarot-museum.com/" />
  <meta property="twitter:title" content="Interactive Tarot Museum - Explore the Mystical Arts" />
  <meta property="twitter:description" content="Discover the rich history and symbolism of tarot through our immersive digital museum experience." />
  <meta property="twitter:image" content="/twitter-image.jpg" />

  <!-- Accessibility -->
  <meta name="theme-color" content="#1a1b23" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <title>Tarot Museum - Interactive Digital Collection</title>
  
  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Museum",
    "name": "Interactive Tarot Museum",
    "description": "A comprehensive digital collection exploring tarot history, symbolism, and divination practices",
    "url": "https://tarot-museum.com",
    "sameAs": [],
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Tarot Collections",
      "itemListElement": [
        {
          "@type": "CreativeWork",
          "name": "Major Arcana Collection",
          "description": "Explore the 22 Major Arcana cards and their deep symbolic meanings"
        },
        {
          "@type": "CreativeWork", 
          "name": "Minor Arcana Collection",
          "description": "Discover the 56 Minor Arcana cards across four suits"
        }
      ]
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  
  <!-- Accessibility: Skip to main content link -->

</html>
